[_]
schema-version = "0.2"

[com.heroku.buildpacks.deb-packages]
# The Ubuntu wxPython wheel depends on GTK/wxWidgets system libraries. The
# development packages pull in the corresponding runtime libraries as well.
install = [
    "libglut-dev",
    "libgl1-mesa-dev",
    "libglu1-mesa-dev",
    "libgstreamer-plugins-base1.0-dev",
    "libgtk-3-dev",
    "libjpeg-dev",
    "libnotify-dev",
    "libpng-dev",
    "libsdl2-dev",
    "libsm-dev",
    "libtiff-dev",
    "libwebkit2gtk-4.1-dev",
    "libxtst-dev",
]

[[io.buildpacks.group]]
id = "heroku/deb-packages"

[[io.buildpacks.group]]
id = "heroku/python"
