# Explicit test-only pipeline; do not include the Auto DevOps template.
image: ubuntu:24.04

stages: [test]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  DEBIAN_FRONTEND: noninteractive
  UV_VERSION: "0.12.6"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never
  UV_NO_BUILD: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  NAGUMIX_GUI_TESTS: "0"

unit-tests:
  stage: test
  interruptible: true
  timeout: 10 minutes
  cache:
    key:
      prefix: ubuntu2404-amd64-py312-uv0126-v1
      files:
        - uv.lock
        - .gitlab-ci.yml
    paths:
      - .cache/uv/
      - .cache/pip/
      - .cache/apt/
    policy: pull-push
  before_script:
    # The locked wxPython wheel targets Ubuntu 24.04 / CPython 3.12 / x86_64.
    - test "$(uname -m)" = x86_64
    # Retain downloaded .debs; Ubuntu's container default deletes them.
    - rm -f /etc/apt/apt.conf.d/docker-clean
    - mkdir -p "$CI_PROJECT_DIR/.cache/apt/partial"
    - apt-get update -qq
    - >-
      apt-get -o Dir::Cache::archives="$CI_PROJECT_DIR/.cache/apt" install -y --no-install-recommends
      ca-certificates python3 python3-venv
      libgtk-3-0t64 libgl1 libnotify4 libsm6 libxtst6 libsdl2-2.0-0 libwebpdemux2
      libcurl4t64 libpcre2-32-0
      xvfb xauth
    - python3 -m venv /tmp/ci-tools
    - '/tmp/ci-tools/bin/pip install --only-binary=:all: "uv==$UV_VERSION"'
    - /tmp/ci-tools/bin/uv sync --locked --no-dev --no-install-project --python /usr/bin/python3
  script:
    - xvfb-run -a .venv/bin/python run_tests.py -v
  # Keep downloaded wheels: `uv cache prune --ci` would discard them and
  # force the large prebuilt wxPython wheel to be downloaded on the next push.
  # No artifacts, image builds, buildpacks, services, or deployment jobs.

windows-gui-tests:
  stage: test
  # Optional until the interactive runner has been validated.
  when: manual
  allow_failure: true
  interruptible: true
  timeout: 20 minutes
  resource_group: windows-gui-desktop
  tags:
    - windows-gui
  variables:
    NAGUMIX_GUI_TESTS: "1"
    UV_PYTHON_DOWNLOADS: automatic
    UV_PYTHON_PREFERENCE: only-managed
    UV_PYTHON_INSTALL_DIR: "$CI_PROJECT_DIR/.cache/uv-python-windows"
    UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv-ci-windows"
  cache:
    # Stable across lockfile changes: uv validates content and reuses unchanged wheels.
    key: windows-amd64-py312-uv0126-v1
    paths:
      - .cache/uv/
      - .cache/uv-python-windows/
      - .ci-tools-windows/
    policy: pull-push
  script:
    - '& ./scripts/ci_windows_gui_tests.ps1'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - windows-gui-tests.log
