name: Linux tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEBIAN_FRONTEND: noninteractive
      UV_VERSION: "0.12.6"
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      UV_NO_BUILD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      NAGUMIX_GUI_TESTS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            .cache/uv
            ~/.cache/pip
          key: ubuntu2404-amd64-py312-uv0126-${{ hashFiles('uv.lock') }}
          restore-keys: ubuntu2404-amd64-py312-uv0126-
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv libgtk-3-0t64 libgl1 libnotify4 libsm6 \
            libxtst6 libsdl2-2.0-0 libwebpdemux2 libcurl4t64 \
            libpcre2-32-0 xvfb xauth
      - name: Install locked Python dependencies
        run: |
          python3 -m venv /tmp/nagumix-ci-tools
          /tmp/nagumix-ci-tools/bin/pip install --only-binary=:all: "uv==$UV_VERSION"
          /tmp/nagumix-ci-tools/bin/uv sync --locked --no-dev --no-install-project --python /usr/bin/python3
      - name: Run tests
        run: xvfb-run -a .venv/bin/python run_tests.py -v
